{% extends 'manager/base_manager.html' %}
{% block title %}Add Employee - Task Queue{% endblock %}

{% block content %}
<style>
  .form-container {
    max-width: 580px;
  }

  .form-header {
    margin-bottom: 20px;
  }

  .form-header h2 {
    font-size: 26px;
  }

  .form-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-light);
    margin-bottom: 6px;
  }

  .form-group input[type="text"],
  .form-group input[type="email"],
  .form-group input[type="password"],
  .form-group select {
    width: 100%;
    padding: 10px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--amber);
    background: var(--card);
  }

  .field-error {
    color: var(--coral);
    font-size: 12px;
    margin-top: 6px;
    font-weight: 500;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 28px;
  }

  .btn-cancel {
    background: transparent;
    color: var(--slate);
    border: 1px solid var(--line);
  }
  .btn-cancel:hover {
    background: var(--paper);
    color: var(--ink);
  }
</style>

<div class="form-container">
  <div class="form-header">
    <h2>Add New Employee</h2>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          
          {% if field.errors %}
            <div class="field-error">
              {{ field.errors|striptags }}
            </div>
          {% endif %}
        </div>
      {% endfor %}

      <div class="form-actions">
        <button type="submit" class="btn">Add Employee</button>
        <a href="{% url 'manager_employee_list' %}" class="btn btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
