<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Manager Panel{% endblock %} | Employee Task Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f4f6f9; }
  .navbar-brand { font-weight: 600; }
  .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .status-pending { background-color: #fff3cd; color: #856404; padding: 3px 10px; border-radius: 20px; font-size: 0.85rem; }
  .status-completed { background-color: #d4edda; color: #155724; padding: 3px 10px; border-radius: 20px; font-size: 0.85rem; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand" href="{% url 'manager_dashboard' %}">📋 Manager Panel</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'manager_dashboard' %}">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'manager_employee_list' %}">Employees</a></li>
    </ul>
  </div>
  <span class="navbar-text text-light me-3">Hi, {{ request.user.username }}</span>
  <form action="{% url 'logout' %}" method="post" class="d-inline">
    {% csrf_token %}
    <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
  </form>
</nav>

<div class="container mt-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
