{% extends 'manager/base_manager.html' %}
{% block title %}Delete Task{% endblock %}
{% block content %}
<h3 class="mb-4">Delete Task</h3>
<div class="card card-stat p-4" style="max-width: 500px;">
  <p>Are you sure you want to delete <strong>"{{ task.title }}"</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
